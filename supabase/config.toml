# Negatic local Supabase config.
# Stable across dev machines; secrets stay in .env.

project_id = "negatic"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = false

# Disabled: Logflare/Vector require the Docker daemon to be exposed on
# tcp://localhost:2375, which Docker Desktop on Windows doesn't do by default.
# We don't need local analytics for the MVP. Re-enable later if needed.
[analytics]
enabled = false
